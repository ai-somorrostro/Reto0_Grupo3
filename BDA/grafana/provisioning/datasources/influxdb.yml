apiVersion: 1

datasources:
  - name: REE InfluxDB
    uid: ree-influxdb
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      tlsSkipVerify: false
    secureJsonData:
      token: ${INFLUX_READ_TOKEN}

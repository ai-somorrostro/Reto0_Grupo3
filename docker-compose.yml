services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD:-change-me-in-local-env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-red_electrica}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-ree_analisis}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_WRITE_TOKEN:-local-dev-influx-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8086/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  loader:
    build:
      context: .
      dockerfile: PIA/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
      REE_PARQUET: /app/ree_data/data/dataset_ree_limpio_transicion_energetica_2019_2025.parquet
    depends_on:
      influxdb:
        condition: service_healthy

  influx-token-init:
    image: python:3.12-slim
    restart: "no"
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_READ_TOKEN_FILE: /run/influx-secrets/INFLUX_READ_TOKEN
    volumes:
      - influx-secrets:/run/influx-secrets
      - ./BDA/scripts/ensure_influx_read_token.py:/usr/local/bin/ensure_influx_read_token.py:ro
    depends_on:
      influxdb:
        condition: service_healthy
    command: ["python", "/usr/local/bin/ensure_influx_read_token.py"]

  node-red:
    build:
      context: BDA/node-red
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1880:1880"
    env_file:
      - .env
    environment:
      ESIOS_TOKEN: ${ESIOS_TOKEN:-}
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-red_electrica}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-ree_analisis}
      INFLUX_WRITE_TOKEN: ${INFLUX_WRITE_TOKEN:?INFLUX_WRITE_TOKEN is required}
    volumes:
      - node-red-data:/data
      - ./BDA/node-red/flows_esios_tiempo_real.json:/opt/node-red/flows.json:ro
    depends_on:
      influxdb:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-local-env}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-REE Grafana}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - influx-secrets:/run/influx-secrets:ro
      - ./BDA/grafana/start-grafana.sh:/etc/grafana/start-grafana.sh:ro
      - ./BDA/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./BDA/grafana/dashboards:/var/lib/grafana/dashboards/ree:ro
    entrypoint: ["/bin/sh", "/etc/grafana/start-grafana.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      loader:
        condition: service_completed_successfully
      influx-token-init:
        condition: service_completed_successfully

  grafana-bootstrap:
    image: python:3.12-slim
    restart: "no"
    env_file:
      - .env
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ORG_ID: ${GRAFANA_ORG_ID:-1}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-local-env}
      GRAFANA_ANALYSIS_DASHBOARD_UIDS: ${GRAFANA_ANALYSIS_DASHBOARD_UIDS:-ree-comunidades}
      INFLUX_URL: http://influxdb:8086
      INFLUX_READ_TOKEN_FILE: /run/influx-secrets/INFLUX_READ_TOKEN
    volumes:
      - ./BDA/scripts/bootstrap_grafana.py:/usr/local/bin/bootstrap_grafana.py:ro
      - ./BDA/grafana/dashboards:/dashboards:ro
      - influx-secrets:/run/influx-secrets:ro
    depends_on:
      grafana:
        condition: service_healthy
    command: ["python", "/usr/local/bin/bootstrap_grafana.py"]

  grafana-mcp-auth-init:
    image: python:3.12-slim
    restart: "no"
    env_file:
      - .env
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-local-env}
      GRAFANA_ORG_ID: ${GRAFANA_ORG_ID:-1}
      GRAFANA_MCP_SERVICE_ACCOUNT_NAME: ${GRAFANA_MCP_SERVICE_ACCOUNT_NAME:-mcp-grafana}
      GRAFANA_MCP_SERVICE_ACCOUNT_ROLE: ${GRAFANA_MCP_SERVICE_ACCOUNT_ROLE:-Viewer}
      GRAFANA_MCP_TOKEN_FILE: /run/mcp-secrets/GRAFANA_MCP_TOKEN
      MCP_GRAFANA_SERVER_TOKEN_FILE: /run/mcp-secrets/MCP_SERVER_TOKEN
    volumes:
      - ./BDA/scripts/ensure_grafana_mcp_token.py:/usr/local/bin/ensure_grafana_mcp_token.py:ro
      - mcp-secrets:/run/mcp-secrets
    depends_on:
      grafana:
        condition: service_healthy
      grafana-bootstrap:
        condition: service_completed_successfully
    command: ["python", "/usr/local/bin/ensure_grafana_mcp_token.py"]

  mcp-grafana:
    image: grafana/mcp-grafana:2.0.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_GRAFANA_PORT:-8000}:8000"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /run/mcp-secrets/GRAFANA_MCP_TOKEN
      MCP_GRAFANA_SERVER_TOKEN_FILE: /run/mcp-secrets/MCP_SERVER_TOKEN
    volumes:
      - mcp-secrets:/run/mcp-secrets:ro
      - ./BDA/grafana/start-mcp-grafana.sh:/usr/local/bin/start-mcp-grafana.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/start-mcp-grafana.sh"]
    command:
      - --transport
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - localhost:8000,127.0.0.1:8000,mcp-grafana:8000
      - --enabled-tools
      - dashboard,datasource,influxdb,runpanelquery
      - --disable-write
      - --enable-query
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8000;
          printf "GET /healthz HTTP/1.1\r\nHost: localhost:8000\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r response <&3;
          [[ "$$response" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      grafana:
        condition: service_healthy
      grafana-mcp-auth-init:
        condition: service_completed_successfully

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  influx-secrets:
  mcp-secrets:
  node-red-data:

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD:-change-me-in-local-env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-red_electrica}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-ree_analisis}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_WRITE_TOKEN:?INFLUX_WRITE_TOKEN is required}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8086/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  loader:
    build:
      context: .
      dockerfile: PIA/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
      REE_PARQUET: /app/ree_data/data/dataset_ree_limpio_transicion_energetica_2019_2025.parquet
    depends_on:
      influxdb:
        condition: service_healthy

  influx-token-init:
    image: python:3.12-slim
    restart: "no"
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_READ_TOKEN_FILE: /run/influx-secrets/INFLUX_READ_TOKEN
    volumes:
      - influx-secrets:/run/influx-secrets
      - ./BDA/scripts/ensure_influx_read_token.py:/usr/local/bin/ensure_influx_read_token.py:ro
    depends_on:
      influxdb:
        condition: service_healthy
    command: ["python", "/usr/local/bin/ensure_influx_read_token.py"]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-local-env}
    volumes:
      - grafana-data:/var/lib/grafana
      - influx-secrets:/run/influx-secrets:ro
      - ./BDA/grafana/start-grafana.sh:/etc/grafana/start-grafana.sh:ro
      - ./BDA/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./BDA/grafana/dashboards:/var/lib/grafana/dashboards/ree:ro
    entrypoint: ["/bin/sh", "/etc/grafana/start-grafana.sh"]
    depends_on:
      loader:
        condition: service_completed_successfully
      influx-token-init:
        condition: service_completed_successfully

  grafana-bootstrap:
    image: python:3.12-slim
    restart: "no"
    env_file:
      - .env
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ORG_ID: ${GRAFANA_ORG_ID:-1}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-local-env}
      GRAFANA_ANALYSIS_DASHBOARD_UIDS: ${GRAFANA_ANALYSIS_DASHBOARD_UIDS:-ree-comunidades}
      INFLUX_URL: http://influxdb:8086
      INFLUX_READ_TOKEN_FILE: /run/influx-secrets/INFLUX_READ_TOKEN
    volumes:
      - ./BDA/scripts/bootstrap_grafana.py:/usr/local/bin/bootstrap_grafana.py:ro
      - ./BDA/grafana/dashboards:/dashboards:ro
      - influx-secrets:/run/influx-secrets:ro
    depends_on:
      grafana:
        condition: service_started
    command: ["python", "/usr/local/bin/bootstrap_grafana.py"]

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  influx-secrets:
